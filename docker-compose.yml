name: muninn

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: valheim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valheim}
      POSTGRES_DB: valheim
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U valheim -d valheim']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      DATABASE_URL: postgres://valheim:${POSTGRES_PASSWORD:-valheim}@db:5432/valheim
      TELEMETRY_SECRET: ${TELEMETRY_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      STEAM_QUERY_HOST: ${STEAM_QUERY_HOST}
      STEAM_QUERY_PORT: ${STEAM_QUERY_PORT}
      PUBLIC_SITE_NAME: ${PUBLIC_SITE_NAME}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PORT: '3000'
      API_MOCK: ${API_MOCK:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3000:3000'
    volumes:
      - ./local/backups:/backups
    depends_on:
      db:
        condition: service_healthy

  valheim:
    profiles: [valheim]
    image: ghcr.io/community-valheim-tools/valheim-server:1.2.0
    cap_add: [SYS_NICE]
    stop_grace_period: 120s
    environment:
      SERVER_NAME: Guild rig
      WORLD_NAME: GuildRig
      SERVER_PASS: ${SERVER_PASS}
      SERVER_PUBLIC: 'true'
      BEPINEX: 'true'
      BACKUPS: 'false'
      TZ: UTC
    ports:
      - '2456:2456/udp'
      - '2457:2457/udp'
      - '127.0.0.1:2458:2458'
    volumes:
      - ./local/valheim/config:/config
      - ./local/valheim/data:/opt/valheim
      - ./plugin/out/GuildTelemetry.dll:/config/bepinex/plugins/GuildTelemetry.dll
    depends_on:
      web:
        condition: service_started

volumes:
  db-data:
