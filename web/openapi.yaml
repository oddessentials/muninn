openapi: 3.1.0
info:
  title: Valheim guild site API
  version: 1.0.0
  summary: Public read API, admin API, live stream and telemetry ingest of the guild site.
  description: 'Conventions: JSON UTF-8; timestamps ISO 8601 UTC with Z; world day integer; coordinates x and z in world metres (the world is a disc of radius 10,000 m centred on 0,0); durations in seconds unless the field name ends in _ms. Ids: players, characters, sessions, raids and jobs are integers; events and server runs are UUID strings; boss keys and global keys are strings. Pagination: limit (1 to 200, default 50) and an opaque cursor; list responses are { items, next_cursor } ordered newest first unless stated. Errors: the HTTP status plus { error: { code, message } }. Caching: public GET responses carry Cache-Control: public, max-age=15 and an ETag; /stream and admin responses are uncacheable. Rate limit: 120 requests per minute per IP on public endpoints, answered with 429 rate_limited; ingest and stream are exempt. Admin auth: POST /admin/login sets a signed session cookie; admin endpoints answer 401 without it; state-changing requests require the Origin header to match ORIGIN.'
servers:
  - url: http://localhost:5173
    description: Local development server (npm run dev, npm run dev:mock).
  - url: http://localhost:3000
    description: Local production image (docker compose up).
  - url: https://{host}
    description: Railway deployment.
    variables:
      host:
        default: guild.example.org
        description: The site domain.
security: []
tags:
  - name: status
    description: Server status and history.
  - name: players
    description: Players, characters and their statistics.
  - name: bosses
    description: Boss progression and timelines.
  - name: raids
    description: Random events.
  - name: world
    description: World, progression keys, saves and the map.
  - name: chat
    description: Shouts, pings and relayed speech.
  - name: structures
    description: Building activity.
  - name: comfort
    description: The comfort pieces the running game defines and how many of each this server has built.
  - name: activity
    description: The unified feed.
  - name: system
    description: Health and this contract.
  - name: stream
    description: Live updates over server-sent events.
  - name: admin
    description: Password-protected administration.
  - name: ingest
    description: Signed telemetry from the server plugin.
  - name: zone
    description: Zone-leader measurements, their ranking and the probe the browser measures against.
paths:
  /api/v1/status:
    get:
      operationId: getStatus
      tags:
        - status
      summary: Server status
      description: Online state, player count, versions, world and run information from the plugin and, independently, from Steam A2S polling.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '429':
          description: 'rate_limited: more than 120 requests per minute from this IP.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: 'not_implemented: the handler is not built yet.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'unavailable: the database cannot be reached.'
          content:
