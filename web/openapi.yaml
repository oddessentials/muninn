          announcement.shown: '#/components/schemas/AnnouncementShownEvent'
    StoredEvent:
      description: One raw event with received_at.
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            received_at:
              type: string
              format: date-time
          required:
            - received_at
    EventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventEnvelope'
        next_cursor:
          type:
            - string
            - 'null'
          description: Opaque cursor for the next page; null on the last page.
      required:
        - items
        - next_cursor
      additionalProperties: false
    IngestBatch:
      type: object
      description: Signed batch posted by the plugin. The HMAC-SHA256 signature is computed over timestamp + "." + body.
      properties:
        plugin:
          type: object
          properties:
            name:
              type: string
            version:
              type: string
          required:
            - name
            - version
          additionalProperties: false
        game:
          type: object
          properties:
            version:
              type: string
            network_version:
              type: integer
          required:
            - version
            - network_version
          additionalProperties: false
        server:
          type: object
          properties:
            name:
              type: string
            world:
              type: string
            world_uid:
              type: integer
          required:
            - name
            - world
            - world_uid
          additionalProperties: false
        events:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryEvent'
          maxItems: 200
          description: Sorted by seq before processing. At most 200 events and 512 KB per request.
      required:
        - plugin
        - game
        - server
        - events
      additionalProperties: false
    PluginAnnouncement:
      type: object
      description: An active announcement handed to the plugin. The plugin shows a message once per id and keeps a restart countdown only while its id keeps appearing, so a cancellation takes effect at the next response.
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/AnnouncementKind'
        text:
          type:
            - string
            - 'null'
        restart_at:
          type:
            - string
            - 'null'
          format: date-time
        restart_in_s:
          type:
            - number
            - 'null'
          description: Seconds from this response until restart_at, computed by the site so the plugin needs no wall clock; null for a message.
      required:
        - id
        - kind
        - text
        - restart_at
        - restart_in_s
      additionalProperties: false
    IngestResult:
      type: object
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        last_seq:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Highest seq in the batch, null for an empty batch.
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/PluginAnnouncement'
          description: Every active announcement at the time of the response, oldest first.
      required:
        - accepted
        - duplicates
        - last_seq
        - announcements
      additionalProperties: false
    StreamFrame:
      type: object
      description: 'One server-sent event as the stream serializes it: an event line with the event name, an id line for activity frames and a data line holding the JSON document.'
      properties:
        event:
          type: string
          enum:
            - status
            - online
            - activity
        id:
          type:
            - string
            - 'null'
          description: The event id for activity frames, null otherwise.
        data:
          description: Status for status frames, OnlineList for online frames, ActivityItem for activity frames.
          oneOf:
            - $ref: '#/components/schemas/Status'
            - $ref: '#/components/schemas/OnlineList'
            - $ref: '#/components/schemas/ActivityItem'
      required:
        - event
        - id
        - data
      additionalProperties: false
    ZoneRating:
      type: string
      enum:
        - excellent
        - strong
        - acceptable
        - weak
        - poor
      description: Band of the overall score, 90, 75, 60 and 40 being the lower bounds of the first four.
    ZoneRecommendation:
      type: string
      enum:
        - primary
        - backup
        - avoid
      description: Whether the guild should hand this player a zone.
    ZoneTestStatus:
      type: string
      enum:
        - ok
        - failed
        - partial
        - skipped
    ZoneValueSource:
      type: string
      enum:
        - measured
        - reported
        - unavailable
      description: Whether a system value was measured, reported by the browser or unavailable.
    ZonePenaltyId:
      type: string
      enum:
        - net-fail-severe
        - net-fail-high
        - net-fail-moderate
        - jitter-extreme
        - jitter-high
        - latency-extreme
        - latency-high
        - cpu-failed
        - network-failed
        - unstable-bench
    ZoneTarget:
      type: object
      description: The probe the network figures were measured against.
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        endpoint:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - label
        - endpoint
      additionalProperties: false
    ZoneSystem:
      type: object
      description: What the browser reports about the machine.
      properties:
        logicalProcessors:
          type:
            - integer
            - 'null'
          minimum: 1
        logicalProcessorsSource:
          $ref: '#/components/schemas/ZoneValueSource'
        deviceMemoryGB:
          type:
            - number
            - 'null'
        deviceMemorySource:
          $ref: '#/components/schemas/ZoneValueSource'
        gpuRenderer:
          type:
            - string
            - 'null'
          maxLength: 200
        gpuVendor:
          type:
            - string
            - 'null'
          maxLength: 200
        gpuSource:
          $ref: '#/components/schemas/ZoneValueSource'
        browser:
          type:
            - string
            - 'null'
          maxLength: 80
        browserSource:
          $ref: '#/components/schemas/ZoneValueSource'
        platform:
          type:
            - string
            - 'null'
          maxLength: 80
        platformSource:
          $ref: '#/components/schemas/ZoneValueSource'
        hardwareConcurrency:
          type:
            - integer
            - 'null'
          minimum: 1
        userAgentDataBrands:
          type:
            - array
            - 'null'
          items:
            type: string
      required:
        - logicalProcessors
        - logicalProcessorsSource
        - deviceMemoryGB
        - deviceMemorySource
        - gpuRenderer
        - gpuVendor
        - gpuSource
        - browser
        - browserSource
        - platform
        - platformSource
        - hardwareConcurrency
        - userAgentDataBrands
      additionalProperties: false
    ZoneCpu:
      type: object
      description: Throughput of the fixed integer kernel in iterations per millisecond.
      properties:
        singleThread:
          type:
            - number
            - 'null'
        multiThread:
          type:
            - number
            - 'null'
        variance:
          type:
            - number
            - 'null'
          description: Coefficient of variation of the single-thread samples.
        samples:
          type: array
          items:
            type: number
          maxItems: 32
        workersUsed:
          type:
            - integer
            - 'null'
          minimum: 0
        kernel:
          type: string
          const: vzd-cpu-1.0.0
      required:
        - singleThread
        - multiThread
        - variance
        - samples
        - workersUsed
        - kernel
      additionalProperties: false
    ZoneNetwork:
      type: object
      description: Round trips and transfers against the probe.
      properties:
        latencyMedianMs:
          type:
            - number
            - 'null'
        latencyP95Ms:
          type:
            - number
            - 'null'
        jitterMs:
          type:
            - number
            - 'null'
          description: Mean absolute successive difference of the round trips.
        uploadMbps:
          type:
            - number
            - 'null'
        downloadMbps:
          type:
            - number
            - 'null'
        failureRate:
          type:
            - number
            - 'null'
          description: Failed requests over total requests, 0 to 1.
        latencySamplesMs:
          type: array
          items:
            type: number
          maxItems: 40
        failedRequests:
          type: integer
          minimum: 0
        totalRequests:
          type: integer
          minimum: 0
        endpointReachable:
          type: boolean
      required:
        - latencyMedianMs
        - latencyP95Ms
        - jitterMs
        - uploadMbps
        - downloadMbps
        - failureRate
        - latencySamplesMs
        - failedRequests
        - totalRequests
        - endpointReachable
      additionalProperties: false
    ZoneStability:
      type: object
      description: Frame timing on the page and a GPU fill probe.
      properties:
        frameTimeP95Ms:
          type:
            - number
            - 'null'
        frameTimeMedianMs:
          type:
            - number
            - 'null'
        stallCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Frames longer than 50 ms during the sample.
        gpuFrameMs:
          type:
            - number
            - 'null'
        gpuApi:
          type: string
          enum:
            - webgl2
            - webgl
            - none
      required:
        - frameTimeP95Ms
        - frameTimeMedianMs
        - stallCount
        - gpuFrameMs
        - gpuApi
      additionalProperties: false
    ZoneMeasurements:
      type: object
      properties:
        cpu:
          $ref: '#/components/schemas/ZoneCpu'
        network:
          $ref: '#/components/schemas/ZoneNetwork'
        stability:
          $ref: '#/components/schemas/ZoneStability'
      required:
        - cpu
        - network
        - stability
      additionalProperties: false
    ZoneScores:
      type: object
      description: Component scores and the weighted overall, 0 to 100 integers.
      properties:
        network:
          type: integer
          minimum: 0
          maximum: 100
        cpu:
          type: integer
          minimum: 0
          maximum: 100
        stability:
          type: integer
          minimum: 0
          maximum: 100
        secondary:
          type: integer
          minimum: 0
          maximum: 100
        overall:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - network
        - cpu
        - stability
        - secondary
        - overall
      additionalProperties: false
    ZonePenalty:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ZonePenaltyId'
        amount:
          type: number
          minimum: 0
          description: Points subtracted from the overall score.
        message:
          type: string
      required:
        - id
        - amount
        - message
      additionalProperties: false
    ZoneCompletion:
      type: object
      properties:
        cpu:
          $ref: '#/components/schemas/ZoneTestStatus'
        network:
          $ref: '#/components/schemas/ZoneTestStatus'
        stability:
          $ref: '#/components/schemas/ZoneTestStatus'
        tabLostFocus:
          type: boolean
        interrupted:
          type: boolean
        warnings:
          type: array
          items:
            type: string
      required:
        - cpu
        - network
        - stability
        - tabLostFocus
        - interrupted
        - warnings
      additionalProperties: false
    ZoneResult:
      type: object
      description: 'One zone-leader measurement, schema version 1 of the zone-leader diagnostic: the same document the browser downloads.'
      properties:
        schemaVersion:
          type: integer
          const: 1
        diagnosticVersion:
          type: string
          minLength: 1
          description: Semantic version of the scoring model; major and minor must match the site's.
        player:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 48
          required:
            - name
          additionalProperties: false
        testedAt:
          type: string
          format: date-time
        diagnosticTarget:
          $ref: '#/components/schemas/ZoneTarget'
        system:
          $ref: '#/components/schemas/ZoneSystem'
        measurements:
          $ref: '#/components/schemas/ZoneMeasurements'
        scores:
          $ref: '#/components/schemas/ZoneScores'
        rating:
          $ref: '#/components/schemas/ZoneRating'
        penalties:
          type: array
          items:
            $ref: '#/components/schemas/ZonePenalty'
        completion:
          $ref: '#/components/schemas/ZoneCompletion'
      required:
        - schemaVersion
        - diagnosticVersion
        - player
        - testedAt
        - diagnosticTarget
        - system
        - measurements
        - scores
        - rating
        - penalties
        - completion
      additionalProperties: false
    ZoneExplanation:
      type: object
      description: Deterministic sentences derived from the measurements.
      properties:
        summary:
          type: string
        strongest:
          type: array
          items:
            type: string
        limiting:
          type: array
          items:
            type: string
        reason:
          type: string
          description: Why the recommendation is what it is.
