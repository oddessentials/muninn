    BossDefeat:
      type: object
      description: >-
        The earliest evidence that the world has defeated this boss. observed is true when the
        plugin saw the first kill, in which case since and day equal first_kill. observed is false
        when the boss's key was already among the world's saved global keys when the log first saw
        it: the kill itself predates the log, and since and day only say when the log learned of
        it.
      properties:
        since:
          type: string
          format: date-time
        day:
          type: integer
        observed:
          type: boolean
      required:
        - since
        - day
        - observed
      additionalProperties: false
