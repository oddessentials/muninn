          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: admin_session
      description: Session cookie set by POST /api/v1/admin/login.
    telemetrySignature:
      type: apiKey
      in: header
      name: X-Telemetry-Signature
      description: sha256=<hex HMAC-SHA256> over X-Telemetry-Timestamp + "." + body with the shared TELEMETRY_SECRET.
  headers:
    CacheControl:
      description: public, max-age=15 on public GET responses.
      schema:
        type: string
    ETag:
      description: Entity tag of the response body.
      schema:
        type: string
    NoStore:
      description: no-store on stream and admin responses.
      schema:
        type: string
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous next_cursor.
      schema:
        type: string
    Since:
      name: since
      in: query
      required: false
      description: Only items at or after this time.
      schema:
        type: string
        format: date-time
    Until:
      name: until
      in: query
      required: false
      description: Only items before this time.
      schema:
        type: string
        format: date-time
    Types:
      name: types
      in: query
      required: false
      description: Restrict to these event types.
      schema:
        type: string
        description: Comma-separated list of event types.
    PlayerFilter:
      name: player
      in: query
      required: false
      description: Only items involving this player id.
      schema:
        type: integer
    PlayerId:
      name: id
      in: path
      required: true
      description: Player id.
      schema:
        type: integer
    BossKey:
      name: key
      in: path
      required: true
      description: Boss key, for example defeated_eikthyr.
      schema:
        type: string
    RaidId:
      name: id
      in: path
      required: true
      description: Raid id.
      schema:
        type: integer
    EventId:
      name: id
      in: path
      required: true
      description: Event id.
      schema:
        type: string
        format: uuid
    JobId:
      name: id
      in: path
      required: true
      description: Job id.
      schema:
        type: integer
    AnnouncementId:
      name: id
      in: path
      required: true
      description: Announcement id.
      schema:
        type: integer
    Alias:
      name: alias
      in: path
      required: true
      description: Raw platform user id of the alias.
      schema:
        type: string
    ZoneName:
      name: name
      in: path
      required: true
      description: 'Character name, normalised: trimmed, inner whitespace collapsed, upper-cased.'
      schema:
        type: string
        minLength: 1
        maxLength: 48
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Sent by EventSource on reconnect; activity items newer than this id are replayed first (at most 100).
      schema:
        type: string
    TelemetryTimestamp:
      name: X-Telemetry-Timestamp
      in: header
      required: true
      description: Signature timestamp.
      schema:
        type: integer
        description: Unix seconds; must be within 5 minutes of the server clock.
    TelemetrySignature:
      name: X-Telemetry-Signature
      in: header
      required: true
      description: HMAC-SHA256 of timestamp + "." + body (or the body SHA-256 hex for the map and catalogue uploads) with the shared secret.
      schema:
        type: string
        pattern: ^sha256=[0-9a-f]{64}$
  schemas:
    Error:
      type: object
      description: Error envelope returned with every non-2xx status.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - payload_too_large
                - unprocessable
                - rate_limited
                - unavailable
                - not_implemented
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Platform:
      type: string
      enum:
        - Steam
        - Xbox
        - PlayStation
        - Nintendo
      description: Platform prefix of the raw platform user id.
    Biome:
      type: string
      enum:
        - Meadows
        - BlackForest
        - Swamp
        - Mountain
        - Plains
        - Mistlands
        - AshLands
        - DeepNorth
        - Ocean
        - None
      description: Biome identifier exactly as the game names it.
    HitType:
      type: string
      enum:
        - EnemyHit
        - PlayerHit
        - Fall
        - Drowning
        - Burning
        - Freezing
        - Poisoned
        - Water
        - Smoke
        - EdgeOfWorld
        - Impact
        - Cart
        - Tree
        - Self
        - Structural
        - Turret
        - Boat
        - Stalagtite
        - Catapult
        - CinderFire
        - AshlandsOcean
        - AshlandsLava
        - Incinerator
        - DrawBridge
        - Undefined
      description: HitData hit type of the last server-observed damage before a death.
    EventType:
      type: string
      enum:
        - server.started
        - server.stopping
        - server.heartbeat
        - server.lost
        - world.save_started
        - world.saved
        - world.rollback_detected
        - world.dusk_approaching
        - world.dawn_approaching
        - player.joined
        - player.spawned
        - player.died
        - player.left
        - player.biome_changed
        - player.position
        - boss.summoned
        - boss.engaged
        - boss.defeated
        - global_key.set
        - raid.started
        - raid.ended
        - structure.built
        - structure.destroyed
        - creature.died
        - chat.message
        - announcement.shown
      description: Every event type in the catalogue, including the four synthetic ones written by the backend (server.lost, world.rollback_detected, world.dusk_approaching, world.dawn_approaching).
    LeftReason:
      type: string
      enum:
        - disconnect
        - timeout
        - kicked
        - server_stop
        - reconciled
        - server_lost
      description: Why a session ended. reconciled and server_lost are assigned by the backend.
    PlayerRef:
      type: object
      description: Reference to a player wherever a player is named. Hidden players appear as null instead of this object.
      properties:
        id:
          type: integer
          description: Player id.
        display_name:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
      required:
        - id
        - display_name
        - platform
      additionalProperties: false
    StatusWorld:
      type: object
      properties:
        name:
          type: string
        uid:
          type: integer
          description: World uid (the world seed identifier as a 64-bit integer).
        day:
          type: integer
          description: Current world day.
        time_of_day:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of the current day that has elapsed, 0 at midnight.
        net_time:
          type: number
          description: World time in seconds as reported by the server.
      required:
        - name
        - uid
        - day
        - time_of_day
        - net_time
      additionalProperties: false
    StatusRun:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
          description: Identifier of the current server process run.
        started_at:
          type: string
          format: date-time
        uptime_s:
          type: number
        plugin_version:
          type: string
      required:
        - run_id
        - started_at
        - uptime_s
        - plugin_version
      additionalProperties: false
    StatusTelemetry:
      type: object
      properties:
        live:
          type: boolean
          description: True while heartbeats arrive within the watchdog window.
        last_heartbeat_at:
          type:
            - string
            - 'null'
          format: date-time
        delayed_since:
          type:
            - string
            - 'null'
          format: date-time
          description: Set when the plugin has been silent for longer than 180 s.
      required:
        - live
        - last_heartbeat_at
        - delayed_since
      additionalProperties: false
    Status:
      type: object
      description: Server status as shown on the dashboard, in the status strip and on /api/status.
      properties:
        online:
          type: boolean
        source:
          type: string
          enum:
            - plugin
            - a2s
            - none
          description: Which signal produced this status.
        player_count:
          type: integer
          minimum: 0
        max_players:
          type: integer
          minimum: 0
        game_version:
          type:
            - string
            - 'null'
        network_version:
          type:
            - integer
            - 'null'
        server_name:
          type: string
        world:
          anyOf:
            - $ref: '#/components/schemas/StatusWorld'
            - type: 'null'
        run:
          anyOf:
            - $ref: '#/components/schemas/StatusRun'
            - type: 'null'
        last_save_at:
          type:
            - string
            - 'null'
          format: date-time
        telemetry:
          $ref: '#/components/schemas/StatusTelemetry'
        updated_at:
          type: string
          format: date-time
      required:
        - online
        - source
        - player_count
        - max_players
        - game_version
        - network_version
        - server_name
        - world
        - run
        - last_save_at
        - telemetry
        - updated_at
      additionalProperties: false
    StatusHistoryPoint:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        online:
          type: boolean
        player_count:
          type: integer
          minimum: 0
      required:
        - ts
        - online
        - player_count
      additionalProperties: false
    StatusHistory:
      type: object
