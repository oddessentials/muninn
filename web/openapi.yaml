          schema:
            $ref: '#/components/schemas/Status'
        online:
          description: The /online list.
          schema:
            $ref: '#/components/schemas/OnlineList'
        activity:
          description: One activity item; the frame id is the event id.
          schema:
            $ref: '#/components/schemas/ActivityItem'
      responses:
        '200':
          description: An event stream that stays open.
