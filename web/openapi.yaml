        name:
          type: string
          description: Resolved boss name, or the prefab or raw key when unknown.
        tier:
          type: string
          enum:
            - forsaken
            - mini
            - other
          description: >-
            forsaken for the eight bosses of the progression, mini for the named foes whose defeat
            sets a key without being a boss to the game, other for any further key the world has
            defeated.
        order:
          type: integer
          minimum: 1
          description: Position within the tier; the game's kill order for the Forsaken.
        summons:
          type: integer
          minimum: 0
        engaged:
          type: integer
          minimum: 0
        kills:
          type: integer
          minimum: 0
          description: Kills the plugin observed; zero for a boss defeated before the log began.
