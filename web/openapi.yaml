  /api/ingest:
    post:
      operationId: ingestBatch
      tags:
        - ingest
      summary: Ingest an event batch
      description: Verifies the timestamp window (5 minutes) and the HMAC with a constant-time comparison, sorts by seq, inserts events with ON CONFLICT DO NOTHING, applies projections for inserted rows in the same transaction and publishes accepted events to the stream.
      security:
        - telemetrySignature: []
      parameters:
        - $ref: '#/components/parameters/TelemetryTimestamp'
        - $ref: '#/components/parameters/TelemetrySignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestBatch'
      responses:
        '200':
          description: Counts for the batch.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '401':
          description: 'unauthorized: bad signature or stale timestamp.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 'payload_too_large: body over 1 MB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'unprocessable: malformed batch.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: 'not_implemented: the handler is not built yet.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'unavailable: database unavailable; the plugin retries.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/ingest/map:
    post:
      operationId: ingestMap
      tags:
        - ingest
      summary: Upload the world map image
      description: Body is a PNG. The signature is the HMAC over timestamp + "." + sha256hex(body). Stored per world uid, replacing any previous image for that uid. Limit 16 MB.
      security:
        - telemetrySignature: []
      parameters:
        - $ref: '#/components/parameters/TelemetryTimestamp'
        - $ref: '#/components/parameters/TelemetrySignature'
        - name: X-World-Uid
          in: header
          required: true
          description: World uid the image belongs to.
          schema:
            type: integer
        - name: X-Map-Size
          in: header
          required: true
          description: Pixels per side.
          schema:
            type: integer
            minimum: 1
        - name: X-Map-Radius
          in: header
          required: true
          description: Metres represented by half the side.
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              contentMediaType: image/png
      responses:
        '204':
          description: Stored.
        '401':
          description: 'unauthorized: bad signature or stale timestamp.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 'payload_too_large: body over 16 MB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'unprocessable: not a PNG or headers missing.'
          content:
            application/json:
