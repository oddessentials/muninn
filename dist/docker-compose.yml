name: muninn

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: muninn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: muninn
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U muninn -d muninn']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    image: ghcr.io/oddessentials/muninn:${MUNINN_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://muninn:${POSTGRES_PASSWORD}@db:5432/muninn
      PLUGIN_EXPORT_DIR: /export
      PLUGIN_EXPORT_ORIGIN: http://web:3000
    volumes:
      - backups:/backups
      - bepinex:/export
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    command: caddy reverse-proxy --from ${DOMAIN:?Set DOMAIN in .env} --to web:3000
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

  valheim:
    profiles: [valheim]
    image: ghcr.io/community-valheim-tools/valheim-server:1.4.0
    cap_add: [SYS_NICE]
    stop_grace_period: 120s
    environment:
      SERVER_NAME: ${SERVER_NAME:-Muninn}
      WORLD_NAME: ${WORLD_NAME:-Dedicated}
      SERVER_PASS: ${SERVER_PASS:-}
      SERVER_PUBLIC: ${SERVER_PUBLIC:-true}
      BEPINEX: 'true'
      TZ: UTC
    ports:
      - '2456-2457:2456-2457/udp'
    volumes:
      - valheim-config:/config
      - valheim-data:/opt/valheim
      - bepinex:/config/bepinex
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  backups:
  bepinex:
  caddy-data:
  caddy-config:
  valheim-config:
  valheim-data:
