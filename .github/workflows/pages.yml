name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - dist/docker-compose.yml
      - web/static/fonts/**
      - web/static/art/tavern-1600.webp
      - web/static/favicon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp -r web/static/fonts _site/assets/fonts
          cp web/static/art/tavern-1600.webp _site/assets/
          cp web/static/favicon.svg _site/
          cp dist/docker-compose.yml _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
