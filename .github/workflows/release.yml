name: release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern GuildTelemetry.dll --dir web/plugin-dll
        env:
          GH_TOKEN: ${{ github.token }}
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/oddessentials/muninn:${{ steps.version.outputs.version }}
            ghcr.io/oddessentials/muninn:latest
          labels: |
            org.opencontainers.image.source=https://github.com/oddessentials/muninn
            org.opencontainers.image.description=A live website for your guild's Valheim server
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  thunderstore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir thunderstore/build
        env:
          GH_TOKEN: ${{ github.token }}
      - run: dotnet tool restore
      - run: dotnet tcli publish --config-path thunderstore/thunderstore.toml --file "thunderstore/build/oddessentials-Muninn-${TAG#v}.zip"
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}

  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp -r web/static/fonts _site/assets/fonts
          cp web/static/art/tavern-1600.webp _site/assets/
          cp web/static/favicon.svg _site/
          cp dist/docker-compose.yml _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
