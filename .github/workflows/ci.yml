name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      PG_DUMP: docker exec -i muninn-dev-db-1 pg_dump
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: docker compose up --detach --wait db
      - run: npm ci
      - run: npm run verify:quick
      - run: npm run api:lint
      - run: npm run api:types:check
      - run: npm run fixtures:check
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test --project plugin/GuildTelemetry.Core.Tests/GuildTelemetry.Core.Tests.csproj

  plugin-build:
    runs-on: ubuntu-latest
    env:
      VALHEIM_SERVER_PATH: ${{ github.workspace }}/valheim-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: managed
        uses: actions/cache@v6
        with:
          path: valheim-server/valheim_server_Data/Managed
          key: valheim-managed-${{ steps.week.outputs.week }}
      - if: steps.managed.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lib32gcc-s1
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +force_install_dir "$VALHEIM_SERVER_PATH" +login anonymous +app_update 896660 validate +quit
          test -f "$VALHEIM_SERVER_PATH/valheim_server_Data/Managed/assembly_valheim.dll"
      - run: dotnet build plugin/GuildTelemetry/GuildTelemetry.csproj -c Release
